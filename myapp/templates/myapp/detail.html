{% extends 'myapp/base.html' %}

{% block body %}

    <div class="m-10 flex">

        <div>
            <img class="w-128 rounded-lg" src="{{ item.item_image }}" alt="{{ item.item_name }}" class="w-64 rounded-lg">
        </div>


        <div class=" mx-16 space-y-4">
            
            <div class="font-bold text-4xl">{{ item.item_name }}</div>
            <div>{{ item.item_desc }}</div>
            <div class="text-green-700 font-bold">${{ item.item_price }}</div>
            <div>
                <a href="{% url 'myapp:update_item' item.id %}" class="bg-yellow-500 px-4 py-2 rounded-md m-2">Edit</a>
                <a href="{% url 'myapp:delete_item' item.id %}" class="bg-red-500 px-4 py-2 rounded-md text-white m-2">delete</a>
                
            </div>
        </div>
        
        



    </div>

{% endblock %}
