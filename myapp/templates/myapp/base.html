<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>

    <nav class="bg-purple-500 text-white p-4">
        <div class="flex justify-between p-4 bg-purple-500 text-white ">
            <a href="" class="font-bold">FoodApp</a>
            <div class="space-x-4">
                <a href="">Contact</a>
                <a href="">Address</a>
                <a href="">About</a>
                <a href="">{{user.username}}</a>
                {% if user.is_authenticated %}
                    <a href="{% url 'users:logout' %}">Logout</a>
                {% else %}
                    <a href="{% url 'users:login' %}">Login</a>
                    <a href="{% url 'users:register' %}">Register</a>
                {% endif %}
            </div>

        </div>
    </nav>

    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{{ message.tags }} p-4 m-4 rounded-md ">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

    {% block body %}
    
    {% endblock %}

</body>
</html>
