<h1> Are you sure you want to delete this item? </h1>
{% if item %}
    <p>Name: {{ item.item_name }}</p>
    <p>Description: {{ item.item_desc }}</p>
    <p>Price: ${{ item.item_price }}</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="bg-red-500 px-4 py-2 rounded-md text-white m-2">Confirm Delete</button>
        <a href="{% url 'myapp:detail' item.id %}" class="bg-gray-500 px-4 py-2 rounded-md text-white m-2">Cancel</a>
    </form>
{% else %}
    <p>Item not found.</p>
{% endif %}
